<!DOCTYPE html>
  <html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Delfin Chileno | Galería AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
      <style>
body {
  margin: 0;
  background: #0f0f12;
  color: #f5f5f7;
  font-family: -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
model-viewer {
  width: 100%;
  flex: 1;
  background-color: #000;
}

/* Header limpio */
.header-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 20px;
}

/* Botón Galería */
.back {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 9px 18px;

  background-color: #1a1a1f;
  color: #f5f5f7;

  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 20px;

  font-size: 13px;
  font-weight: 600;
  text-decoration: none;

  cursor: pointer;
}

.back:hover {
  background-color: #24242a;
}

/* Botón AR */
button[slot="ar-button"] {
  position: absolute;
  right: 18px;
  bottom: 18px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;

  padding: 10px 18px;

  background-color: #4f8cff;
  color: #ffffff;

  border: none;
  border-radius: 20px;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  box-shadow: 0 4px 14px rgba(0,0,0,0.25);

  transition:
    transform 0.2s ease,
    background-color 0.2s ease;
}

button[slot="ar-button"]:hover {
  background-color: #6098ff;
}

button[slot="ar-button"]:active {
  transform: scale(0.96);
}

/* Footer con logos */
.site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  flex-wrap: wrap;
}
.site-footer a { display: flex; align-items: center; }
.site-footer img { height: 40px; width: auto; object-fit: contain; }
.site-footer .footer-credit {
  font-size: 0.75rem;
  color: #9a9aa2;
  text-align: center;
  flex: 1;
}

@media (max-width: 600px) {
  .site-footer { flex-direction: column; text-align: center; }
  .site-footer .footer-credit { order: 3; }
}
      </style>
    </head>
  <body>
 <div class="header-bar">
  <a class="back" href="../../index.html">← Galería</a>
</div>
    <model-viewer
      src="Delfin_Chileno.glb"
      ios-src="Delfin_Chileno.usdz"
      alt="Delfin Chileno Modelo 3D"
      poster="Delfin_Chileno.jpg"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      autoplay
      shadow-intensity="1"
      exposure="1">
      <button slot="ar-button">📱 Ver en tu espacio</button>
      <div class="info" slot="poster">
        <h1>Delfin Chileno</h1>
        <p>Modelo 3D de Delfin Chileno a escala</p>
      </div>
    </model-viewer>

  <footer class="site-footer">
  <a href="https://vecestudio.com/" target="_blank" rel="noopener">
    <img src="../../assets/logo_vec.png" alt="VEC Estudio Creativo">
  </a>
  <p class="footer-credit">Hecho con model-viewer · WebXR / Scene Viewer / Quick Look</p>
  <a href="https://www.instagram.com/museodelaballena/?hl=en" target="_blank" rel="noopener">
    <img src="../../assets/logo_museo.png" alt="Museo de la Ballena y Ciencias del Mar">
  </a>
</footer>

  </body>
</html>

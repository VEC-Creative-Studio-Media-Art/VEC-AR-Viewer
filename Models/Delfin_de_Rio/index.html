<!DOCTYPE html>
  <html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Delfín de Río | Galería AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
      <style>
       body {
  margin: 0;
  background: #0f0f12;
  color: #f5f5f7;
  font-family: -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
model-viewer {
  width: 100%;
  flex: 1;
  background-color: #000;
}

/* Barra superior limpia */
.header-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 20px;
  min-height: 60px;
}

/* Botón para regresar a la galería */
.back {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;

  padding: 9px 18px;

  background: #1a1a1f;
  color: #f5f5f7;

  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 20px;

  font-size: 13px;
  font-weight: 600;
  text-decoration: none;

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease;
}

.back:hover {
  background: #24242a;
  border-color: rgba(255,255,255,0.18);
}

.back:active {
  transform: scale(0.97);
}

/* Footer con logos */
.site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  flex-wrap: wrap;
}
.site-footer a { display: flex; align-items: center; }
.site-footer img { height: 40px; width: auto; object-fit: contain; }
.site-footer .footer-credit {
  font-size: 0.75rem;
  color: #9a9aa2;
  text-align: center;
  flex: 1;
}

@media (max-width: 600px) {
  .site-footer { flex-direction: column; text-align: center; }
  .site-footer .footer-credit { order: 3; }
}
      </style>
    </head>
  <body>
  <div class="header-bar">
  <a href="https://vecestudio.com/" target="_blank" rel="noopener">
    <img src="../../assets/logo_vec.png" alt="VEC Estudio Creativo">
  </a>
  <a class="back" href="../../index.html">← Galería</a>
  <a href="https://www.instagram.com/museodelaballena/?hl=en" target="_blank" rel="noopener">
    <img src="../../assets/logo_museo.png" alt="Museo de la Ballena y Ciencias del Mar">
  </a>
</div>
    <model-viewer
      src="Delfin_de_Rio.glb"
      ios-src="Delfin_de_Rio.usdz"
      alt="Delfin de Río Modelo 3D"
      poster="Delfin_de_Rio.jpg"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      autoplay
      shadow-intensity="1"
      exposure="1">
      <button slot="ar-button">📱 Ver en tu espacio</button>
      <div class="info" slot="poster">
        <h1>Delfín de Río</h1>
        <p>Modelo 3D de Delfín de Río a escala</p>
      </div>
    </model-viewer>

 <footer class="site-footer">
  <a href="https://vecestudio.com/" target="_blank" rel="noopener">
    <img src="../../assets/logo_vec.png" alt="VEC Estudio Creativo">
  </a>
  <p class="footer-credit">Hecho con model-viewer · WebXR / Scene Viewer / Quick Look</p>
  <a href="https://www.instagram.com/museodelaballena/?hl=en" target="_blank" rel="noopener">
    <img src="../../assets/logo_museo.png" alt="Museo de la Ballena y Ciencias del Mar">
  </a>
</footer>
  </body>
</html>

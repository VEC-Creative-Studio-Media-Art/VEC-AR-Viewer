<!DOCTYPE html>
  <html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vaquita Marina | Galería AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0f0f12; color: #f5f5f7; font-family: -apple-system, sans-serif; }
        a.back { position: absolute; top: 14px; left: 14px; color: #f5f5f7; text-decoration: none; background: rgba(0,0,0,0.5); padding: 8px 14px; border-radius: 20px; font-size: 14px; z-index: 10; }
        model-viewer { width: 100%; height: 100vh; background-color: #000; }
        button[slot="ar-button"] {
          background-color: #4f8cff; border-radius: 20px; border: none;
          position: absolute; bottom: 24px; right: 16px; padding: 12px 20px;
          font-size: 14px; font-weight: 600; color: white; cursor: pointer;
        }
        .info { position: absolute; bottom: 24px; left: 16px; z-index: 10; }
        .info h1 { font-size: 1.1rem; margin: 0; }
        .info p { font-size: 0.8rem; color: #9a9aa2; margin: 4px 0 0; }

               
        .site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 24px;
  border-top: 1px solid rgba(255,255,255,0.08);
  flex-wrap: wrap;
}
.site-footer a {
  display: flex;
  align-items: center;
}
.site-footer img {
  height: 36px;
  width: auto;
  object-fit: contain;
}
.site-footer .footer-credit {
  font-size: 0.75rem;
  color: var(--text-dim, #9a9aa2);
  text-align: center;
  flex: 1;
}

/* Móvil: apilado y centrado */
@media (max-width: 600px) {
  .site-footer {
    flex-direction: column;
    text-align: center;
  }
  .site-footer .footer-credit {
    order: 3;
  }
}
      </style>
    </head>
  <body>
  <a class="back" href="../../index.html">← Galería</a>
    <model-viewer
      src="Vaquita_Marina.glb"
      ios-src="Vaquita_Marina.usdz"
      alt="Vaquita Marina Modelo 3D"
      poster="Vaquita_Marina.jpg"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      autoplay
      shadow-intensity="1"
      exposure="1">
      <button slot="ar-button">📱 Ver en tu espacio</button>
      <div class="info" slot="poster">
        <h1>Vaquita Marina</h1>
        <p>Modelo 3D de Vaquita Marina a escala</p>
      </div>
    </model-viewer>

      <footer class="site-footer">
  <a href="https://vecestudio.com/" target="_blank" rel="noopener">
    <img src="../../assets/logo_vec.png" alt="VEC Estudio Creativo">
  </a>
  <p class="footer-credit">Hecho con model-viewer · WebXR / Scene Viewer / Quick Look</p>
  <img src="../../assets/logo_museo.png" alt="Museo de la Ballena y Ciencias del Mar">
  </footer>

  </body>
</html>
